  <rect x="48" y="438" width="1104" height="70" rx="8" fill="#e7e0d5"/>
  <text x="78" y="478" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#121211">NEXT GATE</text>
  <text x="234" y="478" font-family="Arial, sans-serif" font-size="16" fill="#675f53">Arrival photos → parameter screen → single motor, propeller removed</text>
