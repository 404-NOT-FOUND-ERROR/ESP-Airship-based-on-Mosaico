<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ESP AirBoat project roadmap</title>
  <desc id="desc">Verified Mosaico software baseline leading to a single motor bench, three channels and modular helium balloons.</desc>
  <rect width="1200" height="560" fill="#f5f2eb"/>
  <rect x="48" y="44" width="1104" height="120" rx="8" fill="#121211"/>
  <circle cx="88" cy="84" r="10" fill="#ff5600"/>
  <text x="116" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f9f7f2">ESP AIRBOAT</text>
  <text x="116" y="124" font-family="Arial, sans-serif" font-size="16" fill="#bdb8ae">MOSAICO / MODULAR AIRSHIP ROADMAP</text>
  <text x="1060" y="96" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ff8650">3 / 7</text>
  <text x="1060" y="123" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#bdb8ae">BASELINE VERIFIED</text>
  <path d="M124 286H1076" stroke="#c9c1b3" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="286" r="22" fill="#4c8c6b"/>
    <circle cx="390" cy="286" r="22" fill="#4c8c6b"/>
    <circle cx="630" cy="286" r="22" fill="#4c8c6b"/>
    <circle cx="870" cy="286" r="22" fill="#ff5600"/>
    <circle cx="1070" cy="286" r="22" fill="#d0c9bd"/>
    <text x="150" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">0</text>
    <text x="390" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="630" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="870" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="1070" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#675f53">4</text>
    <text x="150" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#121211">OFFLINE</text>
    <text x="150" y="370" text-anchor="middle" font-size="13" fill="#675f53">safety core</text>
    <text x="390" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#121211">MOSAICO</text>
    <text x="390" y="370" text-anchor="middle" font-size="13" fill="#675f53">live identity</text>
    <text x="630" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#121211">SENSOR</text>
    <text x="630" y="370" text-anchor="middle" font-size="13" fill="#675f53">BMI270 / UI</text>
    <text x="870" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#121211">MOTOR</text>
    <text x="870" y="370" text-anchor="middle" font-size="13" fill="#675f53">DRV8833 bench</text>
    <text x="1070" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#121211">BALLOONS</text>
    <text x="1070" y="370" text-anchor="middle" font-size="13" fill="#675f53">tethered flight</text>
