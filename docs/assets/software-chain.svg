<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">AirBoat software ownership</title><desc id="desc">Current UI requests enter a bounded inbox. One task owns safety; output gate integration and the motor adapter are stage 4.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70706C"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#101010}.k{font-size:13px;font-weight:700;letter-spacing:1.5px}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#70706C}.a{fill:none;stroke:#70706C;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#CBCBC6;stroke-width:2}.box{fill:white;stroke:#CBCBC6;stroke-width:1.5}</style>
<rect width="1120" height="480" fill="#F6F6F3"/>
<circle cx="55" cy="48" r="7" fill="#FF4C01"/>

<text x="76" y="53" class="k">MOSAICO / SOFTWARE</text>
<text x="48" y="106" class="t">ONE OWNER FOR EVERY MOTOR ACTION</text>
<text x="48" y="136" class="s">Current software baseline → stage 4 output integration</text>
<rect x="48" y="182" width="210" height="100" rx="8" class="box"/>
<text x="68" y="216" class="h">Touch UI</text><text x="68" y="246" class="s">posts requests</text>
<rect x="310" y="182" width="210" height="100" rx="8" class="box"/>
<text x="330" y="216" class="h">Bounded inbox</text><text x="330" y="246" class="s">8 ordinary requests</text>
<rect x="572" y="182" width="220" height="100" rx="8" class="box"/>
<text x="592" y="216" class="h">Safety owner</text><text x="592" y="246" class="s">10 ms control cycle</text>
<rect x="844" y="182" width="228" height="100" rx="8" fill="#FFF1E9" stroke="#FF4C01" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="864" y="216" class="h">Output adapter</text><text x="864" y="246" class="s">stage 4 / planned</text>
<path d="M258 232H300M520 232H562M792 232H834" class="a"/>
<rect x="48" y="326" width="490" height="100" rx="8" class="box"/>
<text x="70" y="362" class="h">BMI270 → read-only snapshot</text>
<text x="70" y="394" class="s">One sensor owner; consumers read copied values.</text>
<rect x="572" y="326" width="500" height="100" rx="8" fill="#101010"/>
<text x="594" y="362" class="h" style="fill:#F6F6F3">250 ms expiry · 50 ms direction gap</text>
<text x="594" y="394" class="s" style="fill:#CBCBC6">E-STOP latched → CLEAR → DISARMED → new ARM</text>
</svg>
