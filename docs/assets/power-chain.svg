<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">Bench and planned flight power</title><desc id="desc">At the bench, USB-C supplies Mosaico and a separate current-limited source supplies the motor. A single-battery flight design is planned for stage 5.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70706C"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#101010}.k{font-size:13px;font-weight:700;letter-spacing:1.5px}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#70706C}.a{fill:none;stroke:#70706C;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#CBCBC6;stroke-width:2}.box{fill:white;stroke:#CBCBC6;stroke-width:1.5}</style>
<rect width="1120" height="550" fill="#F6F6F3"/>
<circle cx="55" cy="48" r="7" fill="#FF4C01"/>

<text x="76" y="53" class="k">MOSAICO / POWER</text>
<text x="48" y="106" class="t">BENCH NOW. FLIGHT POWER AT STAGE 5.</text>
<rect x="48" y="150" width="492" height="330" rx="8" class="box"/>
<text x="72" y="188" class="k">FIRST MOTOR / BENCH</text>
<rect x="80" y="220" width="210" height="76" rx="6" fill="#F6F6F3"/>
<text x="96" y="251" class="h">Mosaico</text><text x="96" y="276" class="s">USB-C power</text>
<rect x="80" y="334" width="210" height="76" rx="6" fill="#FFF1E9"/>
<text x="96" y="365" class="h">Motor supply</text><text x="96" y="390" class="s">current limited</text>
<rect x="352" y="334" width="158" height="76" rx="6" fill="#F6F6F3"/>
<text x="368" y="365" class="h">DRV8833</text><text x="368" y="390" class="s">VM / GND</text>
<path d="M290 372H342" class="a"/>
<path d="M185 296V440H430V410" fill="none" stroke="#70706C" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="310" y="462" text-anchor="middle" class="s">shared GND reference</text>
<rect x="580" y="150" width="492" height="330" rx="8" fill="none" stroke="#CBCBC6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="604" y="188" class="k">STAGE 5 / FLIGHT PLAN</text>
<rect x="612" y="220" width="160" height="76" rx="6" fill="#FFF1E9"/>
<text x="628" y="251" class="h">1S battery</text><text x="628" y="276" class="s">rating verified</text>
<rect x="834" y="220" width="210" height="76" rx="6" class="box"/>
<text x="850" y="251" class="h">Driver VM</text><text x="850" y="276" class="s">motor branch</text>
<rect x="612" y="334" width="160" height="76" rx="6" class="box"/>
<text x="628" y="365" class="h">5 V boost</text><text x="628" y="390" class="s">logic branch</text>
<rect x="834" y="334" width="210" height="76" rx="6" class="box"/>
<text x="850" y="365" class="h">Mosaico</text><text x="850" y="390" class="s">external 5 V input</text>
<path d="M772 258H824M692 296V324M772 372H824" class="a"/>
<text x="604" y="455" class="s">Verify converters, connectors, and startup load.</text>
<text x="48" y="520" class="s">Keep the motor disconnect within reach; select one Mosaico power input for each test.</text>
