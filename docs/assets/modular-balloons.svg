<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Modular helium lift</title><desc id="desc">A concept with one main and two side balloons, independent valves, a shared frame, and a ventilated ambient barometer under the balloons. Final number and size depend on lift measurements.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70706C"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#101010}.k{font-size:13px;font-weight:700;letter-spacing:1.5px}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#70706C}.a{fill:none;stroke:#70706C;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#CBCBC6;stroke-width:2}.box{fill:white;stroke:#CBCBC6;stroke-width:1.5}</style>
<rect width="1120" height="620" fill="#F6F6F3"/>
<circle cx="55" cy="48" r="7" fill="#FF4C01"/>

<text x="76" y="53" class="k">MOSAICO / MODULAR LIFT PLAN</text>
<text x="48" y="106" class="t">MEASURE EACH MODULE. BALANCE THE WHOLE.</text>
<text x="48" y="136" class="s">Illustrative main + two side modules / count and size follow measured net lift</text>
<ellipse cx="240" cy="266" rx="145" ry="88" fill="white" stroke="#CBCBC6" stroke-width="2"/>
<ellipse cx="560" cy="240" rx="170" ry="112" fill="white" stroke="#FF4C01" stroke-width="2"/>
<ellipse cx="880" cy="266" rx="145" ry="88" fill="white" stroke="#CBCBC6" stroke-width="2"/>
<g text-anchor="middle"><text x="240" y="260" class="h">SIDE A</text><text x="240" y="290" class="s">independent valve</text>
<text x="560" y="234" class="h">MAIN MODULE</text><text x="560" y="264" class="s">independent valve</text>
<text x="880" y="260" class="h">SIDE B</text><text x="880" y="290" class="s">independent valve</text></g>
<path d="M170 342L210 400M310 342L350 400M465 332L470 400M655 332L650 400M810 342L770 400M950 342L910 400" class="line"/>
<rect x="190" y="394" width="740" height="14" rx="4" fill="#101010"/>
<text x="560" y="434" text-anchor="middle" class="s">shared load frame</text>
<path d="M410 408V470M710 408V470" class="line"/>
<rect x="380" y="470" width="360" height="76" rx="8" class="box"/>
<text x="560" y="502" text-anchor="middle" class="h">GONDOLA</text><text x="560" y="528" text-anchor="middle" class="s">Mosaico · power · drivers · motors</text>
<path d="M740 508H792" class="a"/>
<rect x="802" y="470" width="270" height="76" rx="8" fill="#FFF1E9" stroke="#FF4C01" stroke-dasharray="6 4"/>
<text x="822" y="502" class="h">BMP581 / planned</text><text x="822" y="528" class="s">ambient pressure in ventilation</text>
<text x="48" y="590" class="s">Record module lift → weigh the suspended assembly → adjust removable ballast → tether test.</text>
</svg>
